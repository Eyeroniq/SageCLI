name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (no model runtime)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Validator benchmark (gates on attack and benign BLOCK counts)
        run: |
          for set in v1:eval/adversarial.jsonl v2:eval/adversarial_v2.jsonl; do
            python scripts/validator_benchmark.py --layers both --check \
              --data "${set#*:}" --out "benchmarks/validator_results_${set%%:*}.json"
          done

      - name: Accuracy harness (mock engine, no model)
        run: python scripts/eval_accuracy.py --mock --out benchmarks/eval_results.json

      - name: Upload validator and eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/validator_results*
            benchmarks/eval_results*
          if-no-files-found: ignore

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no model download)
        run: docker build -t sagecli:ci .

      - name: Smoke test
        run: docker run --rm sagecli:ci --version
