[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagecli"
version = "0.1.0"
description = "Offline plain-English to Bash assistant with a local LLM and a safety layer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SageCLI contributors" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.12",
    "bashlex>=0.18",
]

[project.optional-dependencies]
# The model runtime is optional so that tests and CI never need to compile it.
llm = ["llama-cpp-python>=0.2.80"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sage = "sagecli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sandbox: integration test that needs bubblewrap (bwrap) installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
